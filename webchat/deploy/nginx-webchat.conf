# Ganti api.DOMAIN_ANDA.com dengan domain Anda yang sebenarnya.
# Setelah file ini aktif, jalankan: sudo certbot --nginx -d api.DOMAIN_ANDA.com
# untuk mendapatkan SSL gratis dari Let's Encrypt (Certbot akan menambahkan
# blok listen 443 ssl secara otomatis).

upstream webchat_backend {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name api.DOMAIN_ANDA.com;

    # Batas ukuran request body (sesuai Express json limit 100kb + margin)
    client_max_body_size 1m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://webchat_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Cegah akses langsung ke file .env / data/ kalau salah konfigurasi
    location ~ /\. {
        deny all;
        return 404;
    }
}
